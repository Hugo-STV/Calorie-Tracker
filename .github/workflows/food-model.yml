# Downloads Google's free AIY food recognizer (2,023 dishes, Apache 2.0) and its label list,
# and converts it for the browser, onto the "food-model" branch.
name: Fetch food model

on:
  push:
    branches: [data-sources]
    paths: ['.github/workflows/food-model.yml']

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download
        run: |
          mkdir -p out raw
          UA="Mozilla/5.0 (Fuel build; github.com/Hugo-STV/Calorie-Tracker)"
          try() { echo "== $1 <- $2"; curl -fsSL --retry 2 -A "$UA" -o "raw/$1" "$2" && ls -la "raw/$1" && file "raw/$1" || echo "FAILED $1 $2" | tee -a out/LOG.txt; }
          try labelmap.csv "https://www.gstatic.com/aihub/tfhub/labelmaps/aiy_food_V1_labelmap.csv"
          try food.tflite "https://tfhub.dev/google/lite-model/aiy/vision/classifier/food_V1/1?lite-format=tflite"
          try kaggle-tflite.tar.gz "https://www.kaggle.com/api/v1/models/google/aiy/tfLite/vision-classifier-food-v1/1/download"
          ls -la raw
          for t in raw/*.tar.gz; do [ -s "$t" ] || continue; mkdir -p "raw/x-$(basename $t .tar.gz)"; tar -xzf "$t" -C "raw/x-$(basename $t .tar.gz)" || true; find "raw/x-$(basename $t .tar.gz)" -type f -exec ls -la {} \; ; done
          # pick a tflite file
          f=$(find raw -name '*.tflite' -size +100k | head -1); [ -z "$f" ] && [ -s raw/food.tflite ] && f=raw/food.tflite
          if [ -n "$f" ]; then mkdir -p out/tflite && cp "$f" out/tflite/food_v1.tflite; fi
          [ -s raw/labelmap.csv ] && cp raw/labelmap.csv out/ && head -5 out/labelmap.csv && wc -l out/labelmap.csv
          true
          # a few freely licensed food photos from Wikimedia Commons, to test recognition
          mkdir -p out/testphotos
          for t in "Pizza" "Spaghetti bolognese" "Caesar salad" "Hamburger" "Pad thai" "Butter chicken" "Poutine" "Pancakes" "Sushi" "Fried rice"; do
            q=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$t")
            url=$(curl -fsSL -A "$UA" "https://en.wikipedia.org/w/api.php?action=query&titles=$q&prop=pageimages&piprop=thumbnail&pithumbsize=640&format=json&redirects=1" | python3 -c "import json,sys; d=json.load(sys.stdin); p=list(d['query']['pages'].values())[0]; print(p.get('thumbnail',{}).get('source',''))")
            n=$(echo "$t" | tr ' A-Z' '-a-z'); [ -n "$url" ] && curl -fsSL -A "$UA" -o "out/testphotos/$n.jpg" "$url" && echo "$n <- $url" >> out/testphotos/SOURCES.txt || echo "no photo for $t"
          done
          ls -la out/testphotos

      - name: Push to the food-model branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find out -type f -printf '%s\t%p\n' | tee out/MANIFEST.txt
          cd out
          git init -q -b food-model
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Food model fetched (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" food-model
