<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0;background:#0E1013}
a{color:#C8F25C}a:hover{color:#E2FF9A}
.h1{font-family:'Space Grotesk',Inter,sans-serif;font-size:26px;line-height:1.2;font-weight:600;margin:0 0 6px;letter-spacing:-0.01em}
.h2{font-family:'Space Grotesk',Inter,sans-serif;font-size:18px;font-weight:600;margin:0}
.sub{color:#9AA3AF;font-size:14px;line-height:1.45;margin:0 0 20px}
.lbl{color:#9AA3AF;font-size:13px;font-weight:600;margin:16px 0 8px;display:block}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;box-sizing:border-box;padding:14px 16px;margin:0 0 10px;background:#171A1F;border:1.5px solid #262B33;border-radius:14px;color:#F2F4F7;font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer}
.opt:hover{border-color:#3A414C}
.opt.on{border-color:#C8F25C;background:#1C2116}
.opt small{display:block;color:#9AA3AF;font-weight:400;font-size:13px;margin-top:3px}
.box{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid #4A525E;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.on .box{background:#C8F25C;border-color:#C8F25C}
.dot{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid #4A525E;box-sizing:border-box}
.on .dot{border:7px solid #C8F25C}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid #2A2F37;background:#171A1F;color:#D6DBE1;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:#C8F25C;border-color:#C8F25C;color:#0E1013}
.inp{width:100%;box-sizing:border-box;height:50px;padding:0 16px;border-radius:12px;border:1.5px solid #2A2F37;background:#171A1F;color:#F2F4F7;font:inherit;font-size:16px;outline:none}
.inp:focus{border-color:#C8F25C}
.btn{height:52px;border:0;border-radius:999px;background:#C8F25C;color:#0E1013;font:inherit;font-size:16px;font-weight:700;cursor:pointer;padding:0 22px}
.btn:disabled{background:#2A2F37;color:#7C8590;cursor:not-allowed}
.ghost{background:#20242B;color:#F2F4F7}
.iconbtn{width:52px;height:52px;flex:none;border-radius:50%;border:0;background:#20242B;color:#F2F4F7;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card{background:#171A1F;border:1px solid #23272E;border-radius:18px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:#9AA3AF}
.small{font-size:12px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;min-height:56px;border:0;background:none;color:#8A93A0;font:inherit;font-size:11px;font-weight:600;cursor:pointer}
.tab.on{color:#F2F4F7}
.fab{width:60px;height:60px;flex:none;border-radius:50%;border:0;background:#C8F25C;color:#0E1013;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 20px rgba(200,242,92,.25);margin:0 4px 0 6px;align-self:center}
.tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 6px;border-radius:6px;background:#262B33;color:#C9D0D8}
.bar{height:8px;border-radius:99px;background:#262B33;overflow:hidden}
.scanline{position:absolute;left:12%;right:12%;height:2px;background:#C8F25C;box-shadow:0 0 12px #C8F25C;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:22%}50%{top:74%}100%{top:22%}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:86px;border:0;border-radius:14px;background:#1B1F25;color:#C8F25C;font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:12px 6px}
.bigtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:118px;border:0;border-radius:18px;background:#20242B;color:#F2F4F7;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0E1013}
.lt{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 16px;border:0;border-bottom:1px solid #2A2F37;background:none;color:#F2F4F7;font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-align:left}
.ltab{flex:none;min-height:44px;padding:0 4px;border:0;border-bottom:2px solid transparent;background:none;color:#9AA3AF;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.ltab.on{color:#F2F4F7;border-bottom-color:#C8F25C}
.fitem{display:flex;align-items:center;gap:10px;background:#171A1F;border:1px solid #23272E;border-radius:14px;padding:4px 8px 4px 0;margin-bottom:8px}
.fname{flex:1;min-width:0;min-height:56px;padding:8px 0 8px 14px;border:0;background:none;color:#F2F4F7;font:inherit;text-align:left;cursor:pointer}
.plus{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:#0E1013;color:#C8F25C;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dayc{width:30px;height:30px;border-radius:50%;border:2px solid #3A414C;box-sizing:border-box}
.dayc.today{border-style:dashed;border-color:#C8F25C}
.pill{flex:1;max-width:16px;height:90px;border-radius:99px;background:#14171B;position:relative;overflow:hidden;margin:0 auto}
.pill>div{position:absolute;left:0;right:0;bottom:0;border-radius:99px}
.dcard{background:#171A1F;border:1px solid #23272E;border-radius:18px;overflow:hidden;margin-top:14px}
.dhead{background:#1B1F25;padding:16px 18px}
.dhead h2{font-family:'Space Grotesk',Inter,sans-serif;font-size:20px;font-weight:600;margin:0 0 6px}
.dhead p{margin:0;color:#9AA3AF;font-size:14px;line-height:1.5}
.wbig::placeholder{color:#3A414C}
.xtab{min-height:48px;border:0;border-bottom:2px solid transparent;background:none;color:#9AA3AF;font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer}
.xtab.on{color:#F2F4F7;border-bottom-color:#C8F25C}
.ovcard{display:block;width:100%;text-align:left;color:#F2F4F7;font:inherit;cursor:pointer;margin-top:12px}
.dayc.done{background:#C8F25C;border-color:#C8F25C}
</style>
<style>
html,body{margin:0;height:100%;background:#0E1013;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
#app,.dc-root{height:100%}
input,textarea,button{font-size:16px}
</style>
</head>
<body><div style="position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99;background:#FFA866;color:#0E1013;font:700 11px Inter,sans-serif;padding:2px 10px;border-radius:0 0 8px 8px;pointer-events:none">PREVIEW</div>
<div id="app"><div style="color:#9AA3AF;font-family:system-ui;padding:40px;text-align:center">Loading Fuel…</div></div>
<template id="screens">
<div class="app-root" style="width: 100%; max-width: 560px; margin: 0 auto; height: 100dvh; position: relative; overflow: hidden; background: #0E1013; color: #F2F4F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box">

<sc-if value="{{isOnb}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; min-height: 0">
  <div style="padding: 20px 20px 0">
    <div style="text-align: center; font-size: 13px; font-weight: 600; color: #9AA3AF; letter-spacing: .06em; text-transform: uppercase">{{section}}</div>
    <div class="bar" style="margin-top: 14px; height: 4px"><div style="height: 4px; width: {{progress}}%; background: #C8F25C; border-radius: 99px"></div></div>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 28px 20px 16px">
    <sc-if value="{{s0}}" hint-placeholder-val="{{ true }}">
      <div style="width: 52px; height: 52px; border-radius: 16px; background: #C8F25C; display: flex; align-items: center; justify-content: center; margin-bottom: 22px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
      </div>
      <h1 class="h1">First, what should we call you?</h1>
      <p class="sub">Fuel builds your calorie and macro targets from a few quick questions.</p>
      <label class="lbl" for="nm">Preferred first name</label>
      <input id="nm" class="inp" value="{{name}}" onChange="{{onName}}" placeholder="Your name" autocomplete="given-name">
      <button type="button" onClick="{{startSignIn}}" style="min-height: 44px; margin-top: 14px; border: 0; background: none; color: #C8F25C; font: inherit; font-weight: 600; padding: 0; cursor: pointer">I already have an account (Fuel or Peak)</button>
    </sc-if>
    <sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
      <h1 class="h1">Hey {{name}}, what are you working toward?</h1>
      <p class="sub">Pick up to three. The first one sets your calorie target.</p>
      <sc-for list="{{goalOpts}}" as="o" hint-placeholder-count="6">
        <button type="button" class="{{o.cls}}" onClick="{{o.pick}}"><span>{{o.label}}<small>{{o.sub}}</small></span><span class="box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button>
      </sc-for>
    </sc-if>
    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <h1 class="h1">What has tripped you up before?</h1>
      <p class="sub">Select all that apply. We use this to tailor reminders and tips.</p>
      <sc-for list="{{barrierOpts}}" as="o" hint-placeholder-count="7">
        <button type="button" class="{{o.cls}}" onClick="{{o.pick}}"><span>{{o.label}}</span><span class="box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button>
      </sc-for>
    </sc-if>
    <sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
      <h1 class="h1">How active are you day to day?</h1>
      <p class="sub">Not counting workouts. Log those under Exercise or sync your workout app.</p>
      <sc-for list="{{activityOpts}}" as="o" hint-placeholder-count="4">
        <button type="button" class="{{o.cls}}" onClick="{{o.pick}}"><span>{{o.label}}<small>{{o.sub}}</small></span><span class="dot"></span></button>
      </sc-for>
    </sc-if>
    <sc-if value="{{s4}}" hint-placeholder-val="{{ false }}">
      <h1 class="h1">A bit about you</h1>
      <p class="sub">Used to estimate how much energy you burn.</p>
      <span class="lbl">Sex used for the calorie formula</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{sexOpts}}" as="o" hint-placeholder-count="2">
          <button type="button" class="{{o.cls}}" style="margin: 0" onClick="{{o.pick}}"><span>{{o.label}}</span><span class="dot"></span></button>
        </sc-for>
      </div>
      <label class="lbl" for="age">Age</label>
      <input id="age" class="inp" inputmode="numeric" value="{{age}}" onChange="{{onAge}}" placeholder="e.g. 29">
      <span class="lbl">Home country</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{countryOpts}}" as="o" hint-placeholder-count="6">
          <button type="button" class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button>
        </sc-for>
      </div>
      <p class="muted small" style="margin-top: 12px">You can scan products from every supported country no matter where home is.</p>
    </sc-if>
    <sc-if value="{{s5}}" hint-placeholder-val="{{ false }}">
      <h1 class="h1">Height and weight</h1>
      <p class="sub">Estimates are fine. You can update these any time.</p>
      <div style="display: flex; gap: 8px; margin-bottom: 6px">
        <button type="button" class="{{unitImpCls}}" onClick="{{setImperial}}">ft / lb</button>
        <button type="button" class="{{unitMetCls}}" onClick="{{setMetric}}">cm / kg</button>
      </div>
      <span class="lbl">Height</span>
      <sc-if value="{{imperial}}" hint-placeholder-val="{{ false }}">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <input class="inp" aria-label="Feet" inputmode="numeric" value="{{ft}}" onChange="{{onFt}}" placeholder="ft">
          <input class="inp" aria-label="Inches" inputmode="numeric" value="{{inch}}" onChange="{{onIn}}" placeholder="in">
        </div>
      </sc-if>
      <sc-if value="{{metric}}" hint-placeholder-val="{{ true }}">
        <input class="inp" aria-label="Height in centimetres" inputmode="numeric" value="{{cm}}" onChange="{{onCm}}" placeholder="cm">
      </sc-if>
      <label class="lbl" for="wt">Current weight ({{wUnit}})</label>
      <input id="wt" class="inp" inputmode="decimal" value="{{weight}}" onChange="{{onWeight}}" placeholder="{{wUnit}}">
    </sc-if>
    <sc-if value="{{s6}}" hint-placeholder-val="{{ false }}">
      <h1 class="h1">{{targetTitle}}</h1>
      <p class="sub">{{targetSub}}</p>
      <sc-if value="{{showGoalWeight}}" hint-placeholder-val="{{ true }}">
        <label class="lbl" for="gw">Goal weight ({{wUnit}}) — optional</label>
        <input id="gw" class="inp" inputmode="decimal" value="{{goalWeight}}" onChange="{{onGoalWeight}}" placeholder="{{wUnit}}">
      </sc-if>
      <sc-if value="{{showPace}}" hint-placeholder-val="{{ true }}">
        <span class="lbl">Pace</span>
        <sc-for list="{{paceOpts}}" as="o" hint-placeholder-count="3">
          <button type="button" class="{{o.cls}}" onClick="{{o.pick}}"><span>{{o.label}}<small>{{o.sub}}</small></span><span class="dot"></span></button>
        </sc-for>
      </sc-if>
      <sc-if value="{{showSurplus}}" hint-placeholder-val="{{ false }}">
        <span class="lbl">Surplus</span>
        <sc-for list="{{surplusOpts}}" as="o" hint-placeholder-count="2">
          <button type="button" class="{{o.cls}}" onClick="{{o.pick}}"><span>{{o.label}}<small>{{o.sub}}</small></span><span class="dot"></span></button>
        </sc-for>
      </sc-if>
    </sc-if>
    <sc-if value="{{s7}}" hint-placeholder-val="{{ false }}">
      <h1 class="h1">How do you like to split your macros?</h1>
      <p class="sub">You can fine-tune grams later under More.</p>
      <sc-for list="{{macroOpts}}" as="o" hint-placeholder-count="3">
        <button type="button" class="{{o.cls}}" onClick="{{o.pick}}"><span>{{o.label}}<small>{{o.sub}}</small></span><span class="dot"></span></button>
      </sc-for>
    </sc-if>
    <sc-if value="{{s8}}" hint-placeholder-val="{{ false }}">
      <h1 class="h1">{{acct.title}}</h1>
      <p class="sub">{{acct.sub}}</p>
      <label class="lbl" for="em">Email</label>
      <input id="em" class="inp" type="email" value="{{email}}" onChange="{{onEmail}}" placeholder="you@example.com" autocomplete="email">
      <label class="lbl" for="pw">Password</label>
      <input id="pw" class="inp" type="password" value="{{pw}}" onChange="{{onPw}}" placeholder="At least 8 characters" autocomplete="{{acct.pwAuto}}">
      <sc-if value="{{acct.hasErr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="color: #FFA866; font-size: 14px; line-height: 1.45; margin: 12px 0 0">{{acct.err}}</p></sc-if>
      <sc-if value="{{acct.hasInfo}}" hint-placeholder-val="{{ false }}"><p role="status" style="color: #C8F25C; font-size: 14px; line-height: 1.45; margin: 12px 0 0">{{acct.info}}</p></sc-if>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; margin-top: 14px">
        <button type="button" onClick="{{acct.toggleMode}}" style="min-height: 44px; border: 0; background: none; color: #C8F25C; font: inherit; font-weight: 600; padding: 0; cursor: pointer">{{acct.toggleLabel}}</button>
        <sc-if value="{{acct.isSignIn}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{acct.forgot}}" style="min-height: 44px; border: 0; background: none; color: #9AA3AF; font: inherit; padding: 0; cursor: pointer">Forgot password?</button></sc-if>
        <sc-if value="{{acct.canSkip}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{acct.skip}}" style="min-height: 44px; border: 0; background: none; color: #9AA3AF; font: inherit; padding: 0; cursor: pointer">Use Fuel without an account</button></sc-if>
      </div>
      <p class="muted small" style="margin-top: 14px; line-height: 1.5">Your account is shared with Peak. Data is stored in your own Firebase project and only you can read it. Without an account, everything stays on this device.</p>
    </sc-if>
    <sc-if value="{{s9}}" hint-placeholder-val="{{ false }}">
      <p class="muted" style="margin: 0 0 6px; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .06em">Your plan</p>
      <h1 class="h1">You're set, {{name}}.</h1>
      <p class="sub">{{planLine}}</p>
      <div class="card" style="text-align: center; padding: 22px 16px">
        <div class="muted" style="font-size: 13px; font-weight: 600">Daily calorie target</div>
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; color: #C8F25C; line-height: 1.1; margin: 6px 0 2px">{{plan.calStr}}</div>
        <div class="muted small">Maintenance ≈ {{plan.tdeeStr}} kcal</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px">
        <sc-for list="{{planMacros}}" as="m" hint-placeholder-count="3">
          <div class="card" style="padding: 14px 12px">
            <div style="width: 10px; height: 10px; border-radius: 3px; background: {{m.color}}; margin-bottom: 8px"></div>
            <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">{{m.g}}g</div>
            <div class="muted small">{{m.label}} · {{m.pct}}%</div>
          </div>
        </sc-for>
      </div>
      <div class="card" style="margin-top: 12px; padding: 6px 16px">
        <div class="row" style="padding: 10px 0; border-bottom: 1px solid #262B33; font-size: 14px"><span class="muted">BMR (energy at rest)</span><span style="font-weight: 600">{{plan.bmrStr}} kcal</span></div>
        <div class="row" style="padding: 10px 0; border-bottom: 1px solid #262B33; font-size: 14px"><span class="muted">Maintenance ({{plan.actLabel}})</span><span style="font-weight: 600">{{plan.tdeeStr}} kcal</span></div>
        <div class="row" style="padding: 10px 0; font-size: 14px"><span class="muted">{{plan.adjLabel}}</span><span style="font-weight: 600; color: {{plan.adjColor}}">{{plan.adjStr}}</span></div>
      </div>
      <p class="muted small" style="margin-top: 14px; line-height: 1.5">BMR uses the Mifflin-St Jeor equation. After 14 days of logging and a few weigh-ins, Fuel checks your real results and adjusts your maintenance automatically.</p>
    </sc-if>
  </div>
  <div style="padding: 12px 20px 24px; display: flex; gap: 12px; align-items: center">
    <sc-if value="{{showBack}}" hint-placeholder-val="{{ false }}">
      <button type="button" class="iconbtn" aria-label="Back" onClick="{{back}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
    </sc-if>
    <button type="button" class="btn" style="flex: 1" disabled="{{nextDisabled}}" onClick="{{next}}">{{nextLabel}}</button>
  </div>
</div>
</sc-if>

<sc-if value="{{isApp}}" hint-placeholder-val="{{ true }}">

<sc-if value="{{vTabs}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; overflow-y: auto; padding: 22px 20px 20px; background: linear-gradient(180deg, #18202A 0, #0E1013 260px)">

  <sc-if value="{{tToday}}" hint-placeholder-val="{{ true }}">
    <div class="row" style="margin-bottom: 18px">
      <h1 class="h1" style="font-size: 32px; margin: 0">Today</h1>
      <div style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px" title="Day streak"><svg width="18" height="18" viewBox="0 0 24 24" fill="#C8F25C" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>{{streak}}<span class="muted small" style="font-weight: 500">day streak</span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; margin-bottom: 18px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
          <span style="font-size: 12px; font-weight: 600; color: {{d.color}}">{{d.l}}</span>
          <div class="{{d.cls}}"></div>
        </div>
      </sc-for>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom: 4px"><span style="font-size: 14px; font-weight: 600">Calories</span><button type="button" onClick="{{openTarget}}" style="min-height: 36px; border: 0; background: none; color: #C8F25C; font: inherit; font-size: 13px; font-weight: 600; padding: 0; cursor: pointer">How it's set ›</button></div>
      <div class="row" style="align-items: baseline">

  <sc-if value="{{tPlan}}" hint-placeholder-val="{{ false }}">

      </div>

    <h2 class="h2" style="font-size: 20px; margin: 26px 0 12px">Repeat meals</h2>

      </div>

<div style="flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 14px 20px 22px">
  <div class="row"><button type="button" class="iconbtn" style="width: 44px; height: 44px; background: none" aria-label="Close" onClick="{{wa.close}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    <button type="button" class="iconbtn" style="width: 44px; height: 44px; background: none" aria-label="Water goal settings" onClick="{{wa.settings}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button></div>
  <h1 class="h1" style="text-align: center; font-size: 24px; margin: 14px 0 22px">Log your water intake</h1>
  <div style="border: 1.5px solid #3A414C; border-radius: 14px; padding: 16px; text-align: center">
    <div style="font-weight: 700; font-size: 15px">Total volume</div>
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 44px; font-weight: 700; color: {{wa.pendColor}}; margin-top: 4px">{{wa.pending}}</div>
    <sc-if value="{{wa.hasPending}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{wa.undo}}" style="min-height: 36px; border: 0; background: none; color: #C8F25C; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Undo last</button></sc-if>
  </div>
  <div style="text-align: center; margin-top: 18px; font-weight: 700">Your daily goal: {{wa.goal}}</div>
  <div style="margin-top: 14px">
    <div class="bar" style="height: 10px; position: relative"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{wa.pendPct}}%; background: #2F5A8C; border-radius: 99px"></div><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{wa.pct}}%; background: #7CC0FF; border-radius: 99px"></div></div>
    <div class="muted small" style="text-align: center; margin-top: 8px">{{wa.todayLine}} so far today</div>
  </div>
  <div style="flex: 1"></div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; align-items: end">
    <sc-for list="{{wa.sizes}}" as="z" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative">
        <div style="font-size: 13px; text-align: center; white-space: pre-line; line-height: 1.3; min-height: 34px">{{z.label}}</div>
        <svg width="70" height="80" viewBox="0 0 70 80" aria-hidden="true"><sc-for list="{{z.shapes}}" as="sh" hint-placeholder-count="3"><path d="{{sh.d}}" fill="{{sh.f}}"></path></sc-for></svg>
        <sc-if value="{{z.hasCount}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 40px; right: 4px; background: #C8F25C; color: #0E1013; border-radius: 99px; padding: 2px 7px; font-size: 12px; font-weight: 700">{{z.count}}</span></sc-if>
        <button type="button" class="plus" style="width: 52px; height: 52px; background: #14171B" aria-label="{{z.aria}}" onClick="{{z.add}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </sc-for>
  </div>
  <button type="button" class="btn" style="width: 100%; margin-top: 26px" disabled="{{wa.saveDisabled}}" onClick="{{wa.save}}">Save</button>
</div>
</sc-if>

<sc-if value="{{vWeightLog}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 14px 20px 22px; background: #151820">
  <div class="row"><button type="button" class="iconbtn" style="width: 44px; height: 44px; background: none" aria-label="Close" onClick="{{wl.close}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button><span style="font-size: 17px">Log weight</span><div style="width: 44px"></div></div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <input class="wbig" aria-label="{{wl.aria}}" inputmode="decimal" value="{{wl.val}}" onChange="{{wl.on}}" placeholder="{{wl.ph}}" style="width: 210px; background: none; border: 0; outline: none; color: #F2F4F7; font-family: 'Space Grotesk', sans-serif; font-size: 76px; font-weight: 700; text-align: right; padding: 0">
      <span style="font-size: 22px">{{wl.unit}}</span>
    </div>
    <div class="muted small" style="margin-top: 8px">{{wl.lastLine}}</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button type="button" onClick="{{wl.cycleDate}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 10px 14px; border: 1.5px solid #3A414C; border-radius: 12px; background: none; color: #F2F4F7; font: inherit; text-align: left; cursor: pointer"><span><span style="display: block; font-weight: 700; font-size: 14px">Date</span><span style="color: #C8F25C; font-size: 16px">{{wl.dateLabel}}</span></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"></path></svg></button>
    <button type="button" onClick="{{wl.photo}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 10px 14px; border: 1.5px solid #3A414C; border-radius: 12px; background: none; color: #F2F4F7; font: inherit; text-align: left; cursor: pointer"><span><span style="display: block; font-weight: 700; font-size: 14px">Progress photo</span><span style="color: #C8F25C; font-size: 16px">Add</span></span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9AA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h3l2-3h5M3 8v11h16v-7"></path><circle cx="11" cy="13" r="3.5"></circle><path d="M19 3v6M16 6h6"></path></svg></button>
  </div>
  <button type="button" class="btn" style="width: 100%; margin-top: 14px" disabled="{{wl.saveDisabled}}" onClick="{{wl.save}}">Log weight</button>
</div>
</sc-if>

<sc-if value="{{vExList}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; min-height: 0">
  <div class="row" style="padding: 14px 8px 0 8px">
    <div style="display: flex; align-items: center; gap: 6px"><button type="button" class="iconbtn" style="width: 44px; height: 44px; background: none" aria-label="Back" onClick="{{ex.back}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button><h1 class="h1" style="font-size: 22px; margin: 0">{{ex.title}}</h1></div>
    <button type="button" aria-pressed="{{ex.multi}}" onClick="{{ex.toggleMulti}}" style="min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: {{ex.multiBg}}; color: {{ex.multiColor}}; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Multi-add</button>
  </div>
  <input class="inp" aria-label="Search for an exercise" value="{{ex.q}}" onChange="{{ex.onQ}}" placeholder="Search for an exercise" style="border: 0; border-bottom: 1px solid #2A2F37; border-radius: 0; background: none; margin-top: 6px; padding: 0 20px">
  <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #14171B">
    <sc-for list="{{ex.tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
  </div>
  <div style="flex: 1; overflow-y: auto">
    <sc-for list="{{ex.rows}}" as="r" hint-placeholder-count="10">
      <button type="button" onClick="{{r.open}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 20px; border: 0; border-bottom: 1px solid #1E2228; background: none; color: #F2F4F7; font: inherit; font-size: 15px; text-align: left; cursor: pointer">
        <sc-if value="{{r.multi}}" hint-placeholder-val="{{ false }}"><span style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid {{r.boxBorder}}; background: {{r.boxBg}}; flex: none; box-sizing: border-box"></span></sc-if>
        <span style="flex: 1; min-width: 0">{{r.name}}</span><span class="muted small" style="white-space: nowrap">{{r.sub}}</span>
      </button>
    </sc-for>
    <sc-if value="{{ex.empty}}" hint-placeholder-val="{{ false }}"><p class="muted" style="padding: 24px 20px; font-size: 14px; line-height: 1.5; margin: 0">{{ex.emptyText}}</p></sc-if>
  </div>
  <div style="padding: 12px 20px 20px; border-top: 1px solid #1E2228">
    <sc-if value="{{ex.showAddSel}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn" style="width: 100%" onClick="{{ex.addSel}}">{{ex.addSelLabel}}</button></sc-if>
    <sc-if value="{{ex.showCreate}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ex.create}}" style="width: 100%; height: 52px; border: 2px solid #C8F25C; border-radius: 999px; background: #171A1F; color: #C8F25C; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Create an exercise</button></sc-if>
  </div>
</div>
</sc-if>

<sc-if value="{{vRoutines}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; overflow-y: auto">
  <div style="display: flex; align-items: center; gap: 6px; padding: 14px 8px 0"><button type="button" class="iconbtn" style="width: 44px; height: 44px; background: none" aria-label="Back" onClick="{{ex.back}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button><h1 class="h1" style="font-size: 22px; margin: 0">Workout routines</h1></div>
  <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #14171B; margin-top: 8px">
    <sc-for list="{{rt.tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
  </div>
  <div style="padding: 4px 16px 0">
    <sc-for list="{{rt.cards}}" as="c" hint-placeholder-count="4">
      <div class="card" style="position: relative; margin-top: 12px; padding: 0">
        <button type="button" onClick="{{c.open}}" style="display: block; width: 100%; padding: 18px 16px 14px; border: 0; background: none; color: #F2F4F7; font: inherit; text-align: left; cursor: pointer">
          <span style="display: block; font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; padding-right: 40px">{{c.title}}</span>
          <span class="muted" style="display: block; font-size: 14px; line-height: 1.45; margin-top: 6px">{{c.list}}</span>
          <span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; text-align: center">
            <span><span style="display: block; font-weight: 700">{{c.sets}}</span><span class="muted small">Sets</span></span>
            <span style="border-left: 1px solid #2A2F37; border-right: 1px solid #2A2F37"><span style="display: block; font-weight: 700">{{c.dur}}</span><span class="muted small">Est duration</span></span>
            <span><span style="display: block; font-weight: 700">{{c.kcal}}</span><span class="muted small">Est calories</span></span>
          </span>
        </button>
        <button type="button" aria-label="Options for {{c.title}}" onClick="{{c.open}}" style="position: absolute; top: 8px; right: 4px; width: 44px; height: 44px; border: 0; background: none; color: #9AA3AF; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></button>
      </div>
    </sc-for>
    <sc-if value="{{rt.empty}}" hint-placeholder-val="{{ false }}"><p class="muted" style="text-align: center; padding: 28px 10px 0; font-size: 14px; line-height: 1.5">No routines yet. Build one below, or save one from Explore.</p></sc-if>
  </div>
  <div style="margin-top: 20px; background: #171A1F; padding: 24px 20px 26px; text-align: center">
    <h2 class="h2" style="font-size: 21px">Track sets, reps and weights</h2>
    <p class="muted" style="font-size: 14px; line-height: 1.5; margin: 8px 0 18px">Build a library of multi-exercise routines from your own training plan.</p>
    <button type="button" class="btn" style="width: 100%" onClick="{{rt.build}}">Build routine</button>
  </div>
</div>
</sc-if>

<sc-if value="{{vRBuild}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; overflow-y: auto; padding: 14px 20px 100px">
  <div class="row"><button type="button" class="iconbtn" style="width: 44px; height: 44px; background: none" aria-label="Cancel routine" onClick="{{rb.cancel}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button><span style="font-weight: 700">New routine</span><div style="width: 44px"></div></div>
  <label class="lbl" for="rb_name">Routine name</label>
  <input id="rb_name" class="inp" value="{{rb.name}}" onChange="{{rb.onName}}" placeholder="e.g. Upper body A">
  <div class="card" style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; padding: 12px 6px">
    <div><div style="font-weight: 700; font-size: 18px">{{rb.sets}}</div><div class="muted small">Sets</div></div>
    <div><div style="font-weight: 700; font-size: 18px">{{rb.dur}}</div><div class="muted small">Est duration</div></div>
    <div><div style="font-weight: 700; font-size: 18px">{{rb.kcal}}</div><div class="muted small">Est calories</div></div>
  </div>
  <h2 class="h2" style="font-size: 18px; margin: 20px 0 8px">Exercises</h2>
  <sc-if value="{{rb.none}}" hint-placeholder-val="{{ true }}"><p class="muted" style="font-size: 14px; margin: 0 0 8px">Add exercises, then set sets and reps for each.</p></sc-if>
  <sc-for list="{{rb.items}}" as="it" hint-placeholder-count="0">
    <div class="card" style="margin-bottom: 8px; padding: 10px 12px 6px 16px">
      <div class="row"><span style="font-weight: 600">{{it.name}}</span><button type="button" aria-label="Remove {{it.name}}" onClick="{{it.remove}}" style="width: 44px; height: 44px; border: 0; background: none; color: #8A93A0; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; align-items: center; gap: 6px"><span class="muted small" style="width: 30px">Sets</span><button type="button" class="plus" style="background: #20242B; color: #F2F4F7" aria-label="Fewer sets" onClick="{{it.sMinus}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><span style="min-width: 22px; text-align: center; font-weight: 700">{{it.s}}</span><button type="button" class="plus" style="background: #20242B; color: #F2F4F7" aria-label="More sets" onClick="{{it.sPlus}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
        <div style="display: flex; align-items: center; gap: 6px"><span class="muted small" style="width: 30px">Reps</span><button type="button" class="plus" style="background: #20242B; color: #F2F4F7" aria-label="Fewer reps" onClick="{{it.rMinus}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button><span style="min-width: 22px; text-align: center; font-weight: 700">{{it.r}}</span><button type="button" class="plus" style="background: #20242B; color: #F2F4F7" aria-label="More reps" onClick="{{it.rPlus}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
      </div>
    </div>
  </sc-for>
  <button type="button" class="tile" style="width: 100%; min-height: 60px; flex-direction: row" onClick="{{rb.togglePick}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add exercise</button>
  <sc-if value="{{rb.picking}}" hint-placeholder-val="{{ false }}">
    <div class="card" style="margin-top: 10px; padding: 12px">
      <input class="inp" aria-label="Search exercises" value="{{rb.q}}" onChange="{{rb.onQ}}" placeholder="Search e.g. squat, press, row">
      <sc-for list="{{rb.results}}" as="f" hint-placeholder-count="6">
        <button type="button" onClick="{{f.add}}" style="display: block; width: 100%; min-height: 48px; border: 0; border-bottom: 1px solid #23272E; background: none; color: #F2F4F7; font: inherit; font-size: 14px; text-align: left; cursor: pointer; padding: 8px 2px">{{f.name}}</button>
      </sc-for>
    </div>
  </sc-if>
</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 20px"><button type="button" class="btn" style="width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,.5)" disabled="{{rb.saveDisabled}}" onClick="{{rb.save}}">Save routine</button></div>
</sc-if>

<sc-if value="{{exMenuOpen}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 6">
    <button type="button" aria-label="Close exercise menu" onClick="{{closeExMenu}}" style="position: absolute; inset: 0; border: 0; background: none; cursor: pointer"></button>
    <div role="dialog" aria-label="Exercises" style="position: relative; width: 300px; background: #262B33; border-radius: 10px; padding: 22px 0 8px; box-shadow: 0 20px 50px rgba(0,0,0,.6)">
      <h2 class="h2" style="font-size: 22px; padding: 0 24px 10px">Exercises</h2>
      <button type="button" class="lt" style="border: 0; padding: 0 24px; font-size: 17px" onClick="{{goCardio}}">Cardiovascular</button>
      <button type="button" class="lt" style="border: 0; padding: 0 24px; font-size: 17px" onClick="{{goStrength}}">Strength</button>
      <button type="button" class="lt" style="border: 0; padding: 0 24px; font-size: 17px" onClick="{{goRoutines}}">Workout routines</button>
      <button type="button" class="lt" style="border: 0; padding: 0 24px; font-size: 17px; color: #C8F25C" onClick="{{quickEx}}">Quick add calories burned</button>
    </div>
  </div>
</sc-if>

<sc-if value="{{vTarget}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; overflow-y: auto; padding: 14px 0 28px">
  <div class="row" style="padding: 0 12px 0 8px"><div style="display: flex; align-items: center; gap: 6px"><button type="button" class="iconbtn" style="width: 44px; height: 44px; background: none" aria-label="Back" onClick="{{tg.back}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button><h1 class="h1" style="font-size: 22px; margin: 0">Your calorie target</h1></div>
    <button type="button" class="chip" style="{{demoChipStyle}}; min-height: 36px; padding: 6px 12px; font-size: 12px" aria-pressed="{{demo}}" onClick="{{toggleDemo}}">{{demoLabel}}</button></div>
  <div style="padding: 0 16px">
    <div class="card" style="text-align: center; margin-top: 10px; padding: 20px 16px">
      <div class="muted" style="font-size: 13px; font-weight: 600">{{tg.goalLine}}</div>
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; color: #C8F25C; line-height: 1.1; margin: 6px 0">{{plan.calStr}}</div>
      <div class="muted small">kcal a day · {{tg.weekly}}</div>
    </div>

    <h2 class="h2" style="font-size: 18px; margin: 22px 0 6px">How we got there</h2>
    <div class="card" style="padding: 4px 16px">
      <sc-for list="{{tg.steps}}" as="st" hint-placeholder-count="5">
        <div style="padding: 12px 0; border-bottom: {{st.border}}">
          <div class="row" style="align-items: flex-start"><span style="min-width: 0"><span style="display: block; font-weight: {{st.weight}}; font-size: {{st.size}}">{{st.label}}</span><span class="muted small" style="line-height: 1.45">{{st.sub}}</span></span><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: {{st.size}}; color: {{st.c}}; white-space: nowrap">{{st.v}}</span></div>
          <div style="position: relative; height: 8px; border-radius: 99px; background: #14171B; margin-top: 8px"><div style="position: absolute; top: 0; bottom: 0; left: {{st.x}}%; width: {{st.w}}%; background: {{st.bar}}; border-radius: 99px"></div></div>
        </div>
      </sc-for>
    </div>

    <h2 class="h2" style="font-size: 18px; margin: 22px 0 6px">Macros from your target</h2>
    <div class="card" style="padding: 4px 16px">
      <sc-for list="{{tg.macros}}" as="m" hint-placeholder-count="3">

      mealChips: Object.keys(mealNames).map((k) => ({ label: mealNames[k], cls: chip(meal === k), pick: () => this.setState({ addMeal: k }) })),
      addMealLabel: mealNames[meal].toLowerCase(),

      formTitle: fm ? fm.title : '', formSub: fm ? fm.sub : '', formFields: fm ? fm.fields : [], formCta: fm ? fm.cta : '',

      isWater: S.sheet === 'water',
      water250: () => this.setState({ water: S.water + 250 }), water500: () => this.setState({ water: S.water + 500 }), waterReset: () => this.setState({ water: 0 }),

      discoverFromLog: () => this.setState({ view: 'browse', browseCat: null, savedOnly: false }),
      ideas: this.ideas.slice(0, 6).map(rx),
      savedIdeas: S.saved.map((id) => this.ideas.find((r) => r.id === id)).map(rx),
      vBrowse: S.view === 'browse', vRecipe: S.view === 'recipe' && !!rcp,

      browseBack: () => { if (S.browseCat) this.setState({ browseCat: null }); else this.setState({ view: 'tabs', tab: 'plan', planView: 'home' }); },
      savedOnly: S.savedOnly, savedOnlyBg: S.savedOnly ? '#2E3612' : 'transparent', savedOnlyFill: S.savedOnly ? '#C8F25C' : 'none',

      browseRowsOn: !S.browseCat && !S.savedOnly, browseGridOn: !!S.browseCat || S.savedOnly,
      browseRows: this.cats.map((c) => ({ title: c.label, more: () => this.setState({ browseCat: c.id }),

          catChips: rcp.cats.map((id) => ({ label: this.cats.find((c) => c.id === id).label, go: () => this.setState({ view: 'browse', browseCat: id, savedOnly: false }) })),

      recipeBack: () => this.setState({ view: S.recipeBack, nutriOpen: false }),

      nutriLabel: S.nutriOpen ? 'HIDE NUTRITION' : 'SHOW NUTRITION', nutriChevron: S.nutriOpen ? 'm6 15 6-6 6 6' : 'm6 9 6 6 6-6',

        this.setState({ sel: food, servings: 1, selG: '', sheet: 'food' }); },
      noSaved: !S.saved.length,
      recipes: S.userRecipes.map((r) => ({ ...rx(r), serving: '1 of ' + r.serves + ' servings', quick: () => this.logFood({ id: 'rx-' + r.id, name: r.title, serving: '1 serving', kcal: r.kcal, p: r.p, c: r.c, f: r.f, region: 'RECIPE', code: '—' }, 1) })),
      noRecipes: !S.userRecipes.length, hasRecipes: S.userRecipes.length > 0,
      openCreateRecipe: () => this.setState({ view: 'builder', builderBack: S.view, builder: { name: '', source: '', serves: 4, lines: [], dir: '', picking: false, q: '' }, sheet: null }),
      ...this.moreVals(S, plan, imp, wUnit, countries, goalNames, g),
      ...this.progressVals(S, plan, eat, imp, wUnit, budget),
