# Downloads Google's free AIY food recognizer (2,023 dishes, Apache 2.0) and its label list,
# and converts it for the browser, onto the "food-model" branch.
name: Fetch food model

on:
  push:
    branches: [data-sources]
    paths: ['.github/workflows/food-model.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download
        run: |
          mkdir -p out raw
          UA="Mozilla/5.0 (Fuel build; github.com/Hugo-STV/Calorie-Tracker)"
          try() { echo "== $1 <- $2"; curl -fsSL --retry 2 -A "$UA" -o "raw/$1" "$2" && ls -la "raw/$1" && file "raw/$1" || echo "FAILED $1 $2" | tee -a out/LOG.txt; }
          try labelmap.csv "https://www.gstatic.com/aihub/tfhub/labelmaps/aiy_food_V1_labelmap.csv"
          try food.tflite "https://tfhub.dev/google/lite-model/aiy/vision/classifier/food_V1/1?lite-format=tflite"
          try kaggle-tflite.tar.gz "https://www.kaggle.com/api/v1/models/google/aiy/tfLite/vision-classifier-food-v1/1/download"
          try kaggle-tf1.tar.gz "https://www.kaggle.com/api/v1/models/google/aiy/tensorFlow1/vision-classifier-food-v1/1/download"
          try kaggle-meta.json "https://www.kaggle.com/api/v1/models/google/aiy"
          ls -la raw
          for t in raw/*.tar.gz; do [ -s "$t" ] && mkdir -p "raw/x-$(basename $t .tar.gz)" && tar -xzf "$t" -C "raw/x-$(basename $t .tar.gz)" && find "raw/x-$(basename $t .tar.gz)" -type f -exec ls -la {} \; ; done
          # pick a tflite file
          f=$(find raw -name '*.tflite' -size +100k | head -1); [ -z "$f" ] && [ -s raw/food.tflite ] && f=raw/food.tflite
          if [ -n "$f" ]; then mkdir -p out/tflite && cp "$f" out/tflite/food_v1.tflite; fi
          [ -s raw/labelmap.csv ] && cp raw/labelmap.csv out/ && head -5 out/labelmap.csv && wc -l out/labelmap.csv
          [ -s raw/kaggle-meta.json ] && cp raw/kaggle-meta.json out/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Convert the TF1 hub module to TensorFlow.js
        continue-on-error: true
        run: |
          d=$(find raw -name 'saved_model.pb' -o -name 'tfhub_module.pb' | head -1 | xargs -r dirname)
          echo "module dir: $d"; [ -n "$d" ] || exit 0
          pip install -q "tensorflowjs==4.22.0" > /dev/null 2>&1 || pip install -q tensorflowjs
          mkdir -p out/tfjs
          tensorflowjs_converter --input_format=tf_hub --quantize_uint8 "$d" out/tfjs 2>&1 | tail -20 || \
          tensorflowjs_converter --input_format=tf_saved_model --quantize_uint8 "$d" out/tfjs 2>&1 | tail -20
          ls -la out/tfjs

      - name: Push to the food-model branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find out -type f -printf '%s\t%p\n' | tee out/MANIFEST.txt
          cd out
          git init -q -b food-model
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Food model fetched (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" food-model
