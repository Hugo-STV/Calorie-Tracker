# Finds freely licensed photos on Wikimedia Commons for Fuel's recipes (several candidates each, with
# author and licence) and puts them on the "recipe-photos" branch to choose from.
name: Fetch recipe photos

on:
  push:
    branches: [data-sources]
    paths: ['.github/workflows/recipe-photos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Search and download
        run: |
          mkdir -p out
          cat > q.json <<'J'
          {"m0": ["asian caramelized chicken and zucchini", "asian caramelized chicken"], "m1": ["bagel with tofu and cucumber", "bagel"], "m2": ["baked pork chop with butternut squash", "baked pork chop"], "m3": ["banana cocoa smoothie"], "m4": ["matcha banana smoothie", "matcha smoothie"], "m5": ["basque-style chicken with pasta and piperade", "basque-style chicken"], "m6": ["roast beef roll ups", "roast beef"], "m7": ["beef stir-fry with broccoli and sesame seeds", "beef stir-fry"], "m8": ["beef taco-style lettuce wraps"], "m9": ["beef with garlic potatoes and green beans", "beef"], "m10": ["blanquette", "vegetable stew cream"], "m11": ["bowl cake", "mug cake"], "m12": ["buckwheat galette with smoked salmon", "buckwheat galette"], "m13": ["buckwheat galette wrap with creamy salmon", "buckwheat galette wrap"], "m14": ["buckwheat wrap with turkey and avocado", "buckwheat wrap"], "m15": ["chaffle", "cheese waffle"], "m16": ["chia pudding with jam", "chia pudding"], "m17": ["chicken and asparagus risotto", "chicken"], "m18": ["chicken pasta salad"], "m19": ["chickpea cookie dough", "cookie dough"], "m20": ["chickpea omelette with hummus and tomatoes", "chickpea omelette"], "m21": ["chickpea salad with mushrooms and soft-boiled eggs", "chickpea salad"], "m22": ["vegetarian chili", "chili sin carne"], "m23": ["chocolate and red bean brownie", "chocolate"], "m24": ["chocolate smoothie"], "m25": ["cloud bread", "oopsie bread"], "m26": ["coconut mango quinoa porridge"], "m27": ["coconut rice with chicken and green beans", "coconut rice"], "m28": ["cottage cheese fruit", "cottage cheese"], "m29": ["creamy chicken and pea pasta", "creamy chicken"], "m30": ["creamy curry pasta with ground beef", "creamy curry pasta"], "m31": ["creamy tuna bowl with wasa crispbread", "creamy tuna bowl"], "m32": ["duck breast sliced", "magret de canard"], "m33": ["tuna and parmesan wrap", "tuna"], "m34": ["egg and bacon muffin", "english muffin breakfast sandwich"], "m35": ["fish skewers with tomato, olives, and basil", "fish skewers"], "m36": ["garlic tomato cod with quinoa", "garlic tomato cod"], "m37": ["greek yogurt honey", "yogurt with honey"], "m38": ["green quinoa with chicken", "green quinoa"], "m39": ["green spinach and grape smoothie", "green spinach"], "m40": ["grilled chicken and hummus wrap", "grilled chicken"], "m41": ["honey mustard chicken", "grilled chicken quinoa"], "m42": ["bündnerfleisch", "viande des grisons", "crispbread cheese"], "m43": ["ground beef stuffed bell pepper"], "m44": ["ham rolls", "ham roll ups"], "m45": ["herb and feta omelet", "herb"], "m46": ["bagel egg sandwich", "bagel sandwich chicken"], "m47": ["crêpes with jam", "crêpes"], "m49": ["hummus and tuna sandwich", "hummus"], "m50": ["celeriac remoulade", "mackerel salad"], "m51": ["marinated seitan and potatoes", "marinated seitan"], "m52": ["mediterranean chicken and chickpea salad", "mediterranean chicken"], "m53": ["mediterranean tuna and quinoa salad", "mediterranean tuna"], "m54": ["chicken polenta", "polenta ratatouille"], "m55": ["pasta leeks", "pasta with leeks"], "m56": ["pickled beet eggs", "pink pickled eggs"], "m57": ["gnocchi cherry tomatoes", "pork escalope"], "m58": ["banana oat smoothie"], "m59": ["cheesecake with red berries", "cheesecake"], "m60": ["frozen yogurt strawberry", "nice cream"], "m61": ["oat pancakes"], "m62": ["overnight porridge with pear, almonds, and chocolate", "overnight porridge"], "m63": ["yogurt with granola and fruits", "yogurt"], "m64": ["yogurt parfait chocolate", "skyr parfait"], "m65": ["quinoa chicken salad with cranberries and feta", "quinoa chicken salad"], "m66": ["quinoa with mushrooms and chicken", "quinoa"], "m67": ["tuna and red bean salad", "tuna"], "m68": ["rice paper egg", "rice paper omelette"], "m69": ["roasted chicken thigh with potatoes and carrots", "roasted chicken thigh"], "m70": ["savory crepe", "crepe ham"], "m71": ["ham cheese pancakes", "savory pancakes"], "m72": ["savory madeleines", "cake salé"], "m73": ["savory pancakes", "ham pancakes"], "m74": ["savory pancakes with smoked salmon", "savory pancakes"], "m75": ["labneh olives", "yogurt dip olives"], "m76": ["spinach waffles", "savory waffles"], "m77": ["scrambled tofu wrap"], "m78": ["skyr and berry smoothie bowl", "skyr"], "m79": ["skyr cheesecake", "cheesecake jar"], "m80": ["smoked salmon and yogurt toast", "smoked salmon"], "m81": ["fondue de poireaux", "leeks cream"], "m82": ["speculoos smoothie", "smoothie cinnamon banana"], "m83": ["steak haché oeuf", "hamburger patty fried egg", "carottes râpées"], "m84": ["quinoa and chicken salad", "quinoa"], "m85": ["salad with chunks and quinoa", "salad"], "m86": ["sweet potato and chestnut gratin", "sweet potato"], "m87": ["blanquette de veau", "blanquette"], "m88": ["tropical chicken and mango salad", "tropical chicken"], "m89": ["tuna toast", "tuna rillettes"], "m90": ["tuna rillettes", "tuna dip"], "m91": ["tuna stuffed avocado"], "m92": ["turkey-stuffed omelet"], "m93": ["apple ginger juice", "apple smoothie"], "m94": ["vanilla banana smoothie"], "m95": ["matcha smoothie", "matcha latte"], "m96": ["chickpea flour spinach omelette"], "m97": ["baguette sandwich tomato", "vegan sandwich"], "m98": ["vegan quiche", "quiche"], "m99": ["zucchini fritters with spinach", "zucchini fritters"], "m100": ["zucchini lasagna", "lasagna zucchini"], "m101": ["vegetable lentil salad"], "m102": ["vegetarian bean sauté"], "m103": ["gnocchi leeks", "gnocchi"], "m104": ["white omelet with salmon and sautéed zucchini", "white omelet"], "m105": ["whole grain toast with cottage cheese and honey or agave", "whole grain toast"], "m106": ["mug cake", "microwave mug cake"], "m107": ["matcha smoothie", "green smoothie"], "m108": ["zucchini noodles with pesto and turkey slices", "zucchini noodles"]}
          J
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, re, os, time
          UA = {'User-Agent': 'FuelRecipePhotos/1.0 (https://github.com/Hugo-STV/Calorie-Tracker)'}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r: return r.read()
          OK = re.compile(r'^(CC0|Public domain|PD|CC BY(-SA)? [\d.]+|CC BY(-SA)?|Attribution|GFDL)', re.I)
          q = json.load(open('q.json')); out = {}
          for rid, terms in q.items():
              seen, cands = set(), []
              for t in terms:
                  api = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode({'action': 'query', 'format': 'json', 'generator': 'search', 'gsrsearch': t + ' filetype:bitmap', 'gsrnamespace': 6, 'gsrlimit': 12, 'prop': 'imageinfo', 'iiprop': 'url|size|extmetadata|mime', 'iiurlwidth': 640})
                  try: d = json.loads(get(api))
                  except Exception as e: print('search failed', t, e); continue
                  pages = sorted((d.get('query') or {}).get('pages', {}).values(), key=lambda p: p.get('index', 99))
                  for p in pages:
                      ii = (p.get('imageinfo') or [{}])[0]; m = ii.get('extmetadata') or {}
                      lic = (m.get('LicenseShortName') or {}).get('value', '')
                      if p['title'] in seen or ii.get('mime') not in ('image/jpeg', 'image/png') or ii.get('width', 0) < 600 or not OK.match(lic): continue
                      seen.add(p['title'])
                      artist = re.sub('<[^>]+>', '', (m.get('Artist') or {}).get('value', '')).strip()
                      cands.append({'file': p['title'], 'thumb': ii.get('thumburl'), 'page': ii.get('descriptionurl'), 'license': lic, 'licenseUrl': (m.get('LicenseUrl') or {}).get('value', ''), 'artist': artist[:120], 'term': t})
                      if len(cands) >= 4: break
                  if len(cands) >= 4: break
                  time.sleep(0.5)
              for i, c in enumerate(cands):
                  fn = f'{rid}-{i}.jpg'
                  try: open('out/' + fn, 'wb').write(get(c['thumb'])); c['local'] = fn
                  except Exception as e: print('download failed', c['file'], e)
                  time.sleep(0.3)
              out[rid] = cands; print(rid, [c['file'] for c in cands])
          json.dump(out, open('out/candidates.json', 'w'), indent=1)
          PY
          ls -la out | head -60

      - name: Push to the recipe-photos branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b recipe-photos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Recipe photo candidates (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" recipe-photos
