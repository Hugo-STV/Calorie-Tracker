# Finds freely licensed photos on Wikimedia Commons for Fuel's recipes (several candidates each, with
# author and licence) and puts them on the "recipe-photos" branch to choose from.
name: Fetch recipe photos

on:
  push:
    branches: [data-sources]
    paths: ['.github/workflows/recipe-photos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Search and download
        run: |
          mkdir -p out
          cat > q.json <<'J'
          {"m2": ["pork chop", "roasted pork chop"], "m11": ["mug cake", "microwave cake"], "m15": ["cheese waffle", "savory waffle"], "m16": ["chia pudding", "chia seed pudding"], "m19": ["edible cookie dough", "cookie dough"], "m23": ["brownie", "chocolate brownie"], "m27": ["coconut rice", "rice green beans chicken"], "m28": ["cottage cheese", "applesauce"], "m29": ["pasta with peas", "creamy chicken pasta"], "m31": ["tuna salad", "crispbread"], "m33": ["tuna wrap", "wrap sandwich"], "m35": ["fish kebab", "fish skewers"], "m36": ["cod with tomatoes", "baked cod"], "m39": ["green smoothie", "spinach smoothie"], "m40": ["chicken wrap", "wrap chicken"], "m41": ["honey mustard chicken", "grilled chicken breast"], "m45": ["feta omelette", "herb omelette"], "m49": ["tuna sandwich", "tuna salad sandwich"], "m51": ["seitan", "seitan dish"], "m53": ["quinoa salad tuna", "quinoa salad"], "m58": ["banana oat smoothie", "banana smoothie"], "m61": ["oat pancakes", "protein pancakes"], "m62": ["overnight oats", "porridge pear"], "m63": ["yogurt granola", "granola yogurt fruit"], "m65": ["quinoa salad feta", "quinoa feta salad"], "m66": ["quinoa mushrooms", "chicken mushrooms"], "m68": ["egg pancake", "rice paper"], "m71": ["ham pancakes", "savory pancakes"], "m72": ["savory madeleines", "madeleines"], "m73": ["vegetable pancakes", "savory pancakes"], "m74": ["blini smoked salmon", "pancakes smoked salmon"], "m78": ["smoothie bowl", "berry smoothie bowl"], "m81": ["leeks cream", "smoked tofu"], "m82": ["banana cinnamon smoothie", "banana milkshake"], "m84": ["chicken quinoa salad", "quinoa salad chicken"], "m85": ["quinoa salad cucumber", "vegan quinoa salad"], "m86": ["sweet potato gratin", "gratin"], "m88": ["mango chicken salad", "mango salad"], "m90": ["tuna dip", "carrot sticks dip"], "m94": ["banana smoothie glass", "banana milkshake"], "m105": ["cottage cheese toast", "toast cottage cheese"], "m106": ["mug cake", "cinnamon cake"], "m107": ["matcha smoothie", "green smoothie yogurt"], "m3": ["chocolate banana smoothie", "chocolate milkshake"], "m5": ["poulet basquaise", "chicken peppers"], "m8": ["lettuce wraps", "lettuce tacos"], "m13": ["smoked salmon wrap", "salmon wrap"], "m14": ["turkey wrap", "turkey avocado wrap"], "m26": ["quinoa porridge", "porridge mango"], "m30": ["curry pasta", "pasta ground beef"], "m43": ["stuffed peppers", "stuffed bell pepper"], "m64": ["yogurt parfait", "parfait"], "m77": ["tofu scramble", "scrambled tofu"], "m91": ["stuffed avocado", "avocado tuna"], "m92": ["cheese omelette", "omelette"], "m96": ["chickpea flour omelette", "socca"], "m102": ["kidney beans peppers", "bean stew"]}
          J
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, re, os, time
          UA = {'User-Agent': 'FuelRecipePhotos/1.0 (https://github.com/Hugo-STV/Calorie-Tracker)'}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r: return r.read()
          OK = re.compile(r'^(CC0|Public domain|PD|CC BY(-SA)? [\d.]+|CC BY(-SA)?|Attribution|GFDL)', re.I)
          q = json.load(open('q.json')); out = {}
          for rid, terms in q.items():
              seen, cands = set(), []
              for t in terms:
                  api = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode({'action': 'query', 'format': 'json', 'generator': 'search', 'gsrsearch': t + ' filetype:bitmap', 'gsrnamespace': 6, 'gsrlimit': 12, 'prop': 'imageinfo', 'iiprop': 'url|size|extmetadata|mime', 'iiurlwidth': 640})
                  try: d = json.loads(get(api))
                  except Exception as e: print('search failed', t, e); continue
                  pages = sorted((d.get('query') or {}).get('pages', {}).values(), key=lambda p: p.get('index', 99))
                  for p in pages:
                      ii = (p.get('imageinfo') or [{}])[0]; m = ii.get('extmetadata') or {}
                      lic = (m.get('LicenseShortName') or {}).get('value', '')
                      if p['title'] in seen or ii.get('mime') not in ('image/jpeg', 'image/png') or ii.get('width', 0) < 600 or not OK.match(lic): continue
                      seen.add(p['title'])
                      artist = re.sub('<[^>]+>', '', (m.get('Artist') or {}).get('value', '')).strip()
                      cands.append({'file': p['title'], 'thumb': ii.get('thumburl'), 'page': ii.get('descriptionurl'), 'license': lic, 'licenseUrl': (m.get('LicenseUrl') or {}).get('value', ''), 'artist': artist[:120], 'term': t})
                      if len(cands) >= 4: break
                  if len(cands) >= 4: break
                  time.sleep(0.5)
              for i, c in enumerate(cands):
                  fn = f'{rid}-{i}.jpg'
                  try: open('out/' + fn, 'wb').write(get(c['thumb'])); c['local'] = fn
                  except Exception as e: print('download failed', c['file'], e)
                  time.sleep(0.3)
              out[rid] = cands; print(rid, [c['file'] for c in cands])
          json.dump(out, open('out/candidates.json', 'w'), indent=1)
          PY
          ls -la out | head -60

      - name: Push to the recipe-photos branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b recipe-photos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Recipe photo candidates (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" recipe-photos
